# Plot forcing recipes for the new sites outside Banff (ADR-108; Ben 2026-11-02: "start building").
# Same layout as config/plot_forcing.yaml, kept in its own file on purpose: the lab and its training cache read
# plot_forcing.yaml, so adding plots there would change every Banff run and invalidate Ben's cache. Nothing here is
# used by the daily update, the public site or the lab until Ben decides to add the sites (each a separate change).
#
# Status: Parker Ridge has pits (the lab's Jasper test set, ADR-117) and is on the public site (ADR-139, Ben
# 2026-11-22: "can you add parkers profiles and study plot to the banff-snowpack app"); Fidelity has none and is
# not. Nothing here has been calibrated: all factors are 1.0 (no correction) on purpose, the sites stay an
# out-of-sample test of the Banff-tuned model, which must not be tuned to them first.
season_start: "09-15"
season_end: "06-30"
era5_dir: data/interim/era5_north_west   # `snowagent ingest era5 --region north_west`
# Station tables with Banff column names: `snowagent ingest fts360 --section fts360_new_sites [--offline]` (Big Bend,
# Tangle Ridge) and `snowagent ingest avcan-weather [--offline]` (Fidelity, Round Hill) write them here.
station_dir: data/interim/new_sites/stations
# The lab's Jasper test set (config/lab_jasper.yaml, ADR-117) reads this file too. Its import moves the stations'
# temperature and humidity to the plot's height (station_elevation_m below), as the baseline run does: Big Bend
# stands 115 m above Parker Ridge and Tangle Ridge, its fallback, 1000 m. Banff's lab keeps values as measured.
lab_move_to_plot_height: true
plots:
  parker_ridge:
    name: Parker Ridge study plot (Jasper)
    # USER-CONFIRMED 2026-11-02 (Ben's map marker for the Parker Ridge plot, elevation 2010 m). The Big Bend station
    # (FTS360 "BIG BEND 2125m", 52.178288 N 117.073326 W) is 2.9 km to the south-east and 115 m higher; its
    # temperature and humidity are moved to the plot's height like the Banff stations' (lapse rate, dewpoint).
    lat: 52.19587
    lon: -117.10408
    elevation_m: 2010
    location_source: user_2026-11-02
    ta: [big_bend, tangle_ridge]
    rh: [big_bend, tangle_ridge]
    psum: [big_bend]                    # cumulative gauge ("Precip"), uncorrected for undercatch
    hs_check: [big_bend]                # ultrasonic snow depth ("SD", cm)
    psum_factor: 1.0
    era5_psum_factor: 1.0
    # Site only (ADR-139): the GFS/HRDPS point extracted for the plot's forecasts and live-season fill (the
    # `site` block below), and the winters before Big Bend's record (2001-02 to 2013-14 pits) run on ERA5 alone
    # with no transfer correction (no offset, gauge ratio 1), as the lab's Jasper test set runs them.
    gfs_point: parker_ridge_plot
    station_seasons_from: 2018          # Big Bend's record starts November 2018
    era5_transfer: {method: constant, ta_offset_k: 0.0, psum_ratio: 1.0}
  fidelity:
    name: Fidelity study plot (Glacier National Park, Rogers Pass)
    lat: 51.234383                      # Avalanche Canada station 93 (FID_60); plot assumed at the station
    lon: -117.700966
    elevation_m: 1905
    location_source: avcan_station_93
    ta: [fidelity]
    rh: [round_hill]                    # Fidelity's own humidity field repeats the air temperature (ADR-108)
    psum: [fidelity]                    # hourly precipitation from the API (mm)
    hs_check: [fidelity]
    psum_factor: 1.0
    era5_psum_factor: 1.0
station_elevation_m:
  big_bend: 2125
  tangle_ridge: 3009
  fidelity: 1905
  round_hill: 2100
# The public site's plots from this file (ADR-139), beside the three Banff plots of config/plot_forcing.yaml. The
# daily update fetches their stations (`fts360_new_sites`), this file's ERA5 box, and GFS and HRDPS at each plot's
# gfs_point, into folders of their own so the Banff archives and the lab's inputs never change.
site:
  plots:
    parker_ridge: Parker Ridge (Jasper)
  forecast_source: hrdps
  gfs_dir: archive/forecasts/new_sites/gfs
  hrdps_dir: archive/forecasts/new_sites/hrdps
