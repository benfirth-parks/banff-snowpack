; SNOWPACK engine template for independent terrain-conditioned columns.
; Every key below was checked against the installed source (commit b324cbd, see
; docs/decisions.md ADR-003). Placeholders in {braces} are filled per run by
; snowagent.engine.snowpack; do not add keys without verifying them.
;
; Ownership of terrain corrections (ADR-004):
;   PERP_TO_SLOPE = TRUE -> the engine does NOT project shortwave or precipitation
;   onto the slope. The terrain forcing adapter supplies ISWR already incident on the
;   slope plane (direct with horizon shading + sky-view diffuse + terrain reflected)
;   and PSUM per slope-parallel area (horizontal flux x cos(slope)).
;   The engine keeps slope-normal layer geometry and reports vertical heights.

[General]
BUFFER_SIZE = 370
BUFF_BEFORE = 1.5

[Input]
COORDSYS = UTM
COORDPARAM = {utm_zone}
TIME_ZONE = 0
METEO = SMET
METEOPATH = ./input
METEOFILE1 = {station_id}.smet
SNOW = SMET
SNOWPATH = ./input
SNOWFILE1 = {station_id}

[Output]
COORDSYS = UTM
COORDPARAM = {utm_zone}
TIME_ZONE = 0
METEOPATH = ./output
EXPERIMENT = run
SNOW_WRITE = TRUE
SNOW_DAYS_BETWEEN = {snow_days_between}
FIRST_BACKUP = {first_backup}
TS_WRITE = TRUE
TS_FORMAT = MET
TS_START = 0.0
TS_DAYS_BETWEEN = {ts_days_between}
PROF_WRITE = TRUE
PROF_FORMAT = PRO
PROF_START = 0.0
PROF_DAYS_BETWEEN = {prof_days_between}
PROF_ID_OR_MK = ID
PROF_AGE_OR_DATE = DATE
AGGREG_PRF = FALSE
OUT_STAB = TRUE
OUT_MASS = TRUE
OUT_HAZ = TRUE

[Snowpack]
CALCULATION_STEP_LENGTH = {calculation_step_min}
ROUGHNESS_LENGTH = 0.002
HEIGHT_OF_METEO_VALUES = {met_height_m}
HEIGHT_OF_WIND_VALUE = {wind_height_m}
ENFORCE_MEASURED_SNOW_HEIGHTS = FALSE
FORCING = ATMOS
SW_MODE = INCOMING
ATMOSPHERIC_STABILITY = MO_SCHLOEGL_MULTI_OFFSET
CANOPY = FALSE
MEAS_TSS = FALSE
CHANGE_BC = FALSE
SNP_SOIL = FALSE
SOIL_FLUX = FALSE
GEO_HEAT = 0.06

[SnowpackAdvanced]
VARIANT = DEFAULT
NUMBER_SLOPES = 1
PERP_TO_SLOPE = TRUE
SNOW_EROSION = FALSE
SNOW_REDISTRIBUTION = FALSE
HN_DENSITY = PARAMETERIZED
WATERTRANSPORTMODEL_SNOW = BUCKET
COMBINE_ELEMENTS = FALSE
# ADR-031: hand-hardness relation (engine default MONTI); hardness is an output, it does not change the physics
HARDNESS_PARAMETERIZATION = BELLAIRE

[Filters]
PSUM::filter1 = min
PSUM::arg1::soft = true
PSUM::arg1::min = 0.0
RH::filter1 = min_max
RH::arg1::soft = true
RH::arg1::min = 0.05
RH::arg1::max = 1.0

[Interpolations1D]
MAX_GAP_SIZE = 10800
PSUM::resample1 = accumulate
PSUM::ARG1::period = {psum_period_s}
VW::resample1 = nearest
VW::ARG1::extrapolate = true
DW::resample1 = nearest
DW::ARG1::extrapolate = true
