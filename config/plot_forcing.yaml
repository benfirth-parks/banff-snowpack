# Plot forcing recipes for the uncorrected baseline (2021-22 to 2025-26).
# Each variable lists sources in priority order; the first valid ("ok") value per hour wins, ERA5 fills the
# rest. Every hour records which source supplied each variable. Station values are moved to the plot
# elevation with the lapse rate / dewpoint conservation of spatial_forcing.builder (single owner).
season_start: "09-15"   # snow-free start (study plots are bare by mid-September)
season_end: "06-30"
plots:
  goats_eye:
    gfs_point: sunshine_village_ab_env_plot  # archived GFS point extract used for this plot
    name: Goat's Eye study plot
    lat: 51.089530                      # user-confirmed 2026-10-01 (ADR-026, second message)
    lon: -115.754620
    elevation_m: 2280                   # user: use the pit-header elevation
    ta: [sunshine_village_ab_env, lookout]
    rh: [lookout]                       # Sunshine AB Env has no humidity; Lookout 2.6 km away, 2640 m
    psum: [sunshine_village_ab_env]     # weighing gauge, uncorrected for undercatch
    hs_check: [sunshine_village_ab_env]
    hs_check_ghcnd: [CA003056267]       # Sunshine CS, 2187 m, daily snow depth 1997-2007 (ERA5-only seasons)
    swe_check: [sunshine_village_ab_env]  # AB Env snow pillow (valid from 2024-10; earlier winters flagged suspect)
    # ADR-038: 11-season leave-one-season-out (2015-26, station forcing): 0.9 chosen in 11/11 folds; held-out HS
    # MAE 0.163 -> 0.130 m (8/11 seasons better), pit depth error 18.0 -> 10.1 cm. Gauge over-catch vs the plot.
    psum_factor: 0.9
  bow_summit:
    gfs_point: bow_summit_plot  # archived GFS point extract used for this plot
    name: Bow Summit study plot
    lat: 51.70946                       # user-confirmed 2026-10-01 (ADR-026)
    lon: -116.47950
    elevation_m: 2040
    ta: [bow_summit, bow_summit_precip_ab_env]
    rh: [bow_summit]
    psum: [bow_summit_precip_ab_env]
    hs_check: [bow_summit, bow_summit_precip_ab_env]
    hs_check_ghcnd: [CA00305A002, CA003050PPF]   # Bow Summit (PC) 2012 m, Bow Summit (AE): daily 1998-2007
    # ADR-024: adopted after leave-one-season-out test (held-out HS MAE 0.163 -> 0.116 m, 4/5 seasons better).
    # Applied only with `snowagent baseline --corrected`; the uncorrected baseline stays the reference.
    psum_factor: 1.15
  simpson:
    gfs_point: simpson_lower  # archived GFS point extract used for this plot
    name: Simpson study plot (co-located with Simpson Lower station; user-confirmed 2026-10-01)
    lat: 50.98516
    lon: -115.98430
    elevation_m: 2115
    ta: [simpson_lower, simpson_upper]
    rh: [simpson_lower, simpson_upper]
    psum: [sunshine_village_ab_env]     # no gauge at Simpson: nearest gauge (Sunshine, ~15 km) - flagged
    hs_check: [simpson_lower]
    # ADR-024: adopted after leave-one-season-out test (held-out HS MAE 0.180 -> 0.119 m, 4/5 seasons better);
    # corrects the transfer of the Sunshine gauge to Simpson. Applied only with --corrected.
    psum_factor: 1.15
station_elevation_m:   # from the user's station list / config
  sunshine_village_ab_env: 2200
  lookout: 2640
  bow_summit: 2040
  bow_summit_precip_ab_env: 2040
  simpson_lower: 2115
  simpson_upper: 2320
# wind and radiation: no study-plot station measures them -> ERA5 (vw, dw, iswr, ilwr), flagged
# Stations switched off for part of the year (ADR-043). User 2026-10-03: Lookout is seasonal, off for the summer,
# not retired. In off_months a stale record is reported as expected (status level "info"); in other months it is a
# stale-data warning like any station's. Lookout's 2021-26 record: summer outages from June, back mid-Sep to Oct.
seasonal_stations:
  lookout:
    off_months: [6, 7, 8, 9, 10]
