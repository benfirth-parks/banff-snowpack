# Plot forcing for the Bald Hills test site in Jasper (ADR-148; owner 2026-11-23, "do 2": test Carver Daniels at a
# plot whose weather shares nothing with Banff or Parker Ridge). Same layout as config/new_sites.yaml, in a file of
# its own so neither the Banff lab, the Jasper (Parker Ridge) test set nor the public site changes.
# Nothing is calibrated: every factor is 1.0, so the site stays an out-of-sample test that no model was tuned to.
season_start: "09-15"
season_end: "06-30"
era5_dir: data/interim/era5_bald_hills   # ERA5 0.25 deg box 52.5-53.0 N, 118.0-117.25 W (scratch script, ADR-148)
# Converted Maligne months (snowagent.newsites.bald_hills.convert: the 2020-24 logger's SD/Precip renamed to the
# 2024+ logger's SDcm/PC so every month parses).
station_dir: data/interim/bald_hills/stations
lab_move_to_plot_height: true            # Maligne stands about 470 m below the plot
plots:
  bald_hills:
    name: Bald Hills study plot (Jasper)
    # Mean of the GPS fixes printed on the 2022-25 study-plot pits (52.7160/-117.6875, 52.7158/-117.6881,
    # 52.7159/-117.6876, 52.71583/-117.68784); height the middle of the printed 2150-2194 m.
    lat: 52.7159
    lon: -117.6877
    elevation_m: 2170
    location_source: pit_headers_2022-2025
    ta: [maligne]
    rh: [maligne]
    psum: [maligne]        # cumulative gauge at 1700 m, uncorrected for undercatch or height
    hs_check: [maligne]    # ultrasonic snow depth at 1700 m (not at the plot)
    psum_factor: 1.0
    era5_psum_factor: 1.0
station_elevation_m:
  maligne: 1700
