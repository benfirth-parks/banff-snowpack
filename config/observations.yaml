# Field-observation intake configuration (user data, 2025-26 season upload).
# Profiles are training/calibration/evaluation data only; never required at runtime.
source:
  path: profiles/                 # raw uploads; immutable (never edited by the pipeline)
  format: propagation_labs_manual_profile   # PDF (header text + rendered chart) / PNG / JPG
# Observation times in the exports carry no zone designator. User confirmed 2026-09-30:
# "time zone is MST" -> fixed UTC-7 (IANA Etc/GMT+7; the sign is inverted by convention).
time_zone: Etc/GMT+7
time_zone_confirmed: true
# Study-plot site keys (from folder names) -> weather station (config/stations.yaml)
study_plots:
  goats_eye: {name: "Goat's Eye", station_id: sunshine_village_ab_env}   # user-confirmed 2026-09-30
  bow_summit: {name: Bow Summit, station_id: bow_summit}  # alias list below                  # by name; confirm
  simpson: {name: Simpson, station_id: simpson_lower, station_ids: [simpson_lower, simpson_upper]}  # user-confirmed 2026-09-30
  tak_falls: {name: Tak Falls, station_id: null}   # user-confirmed: study plot without a weather station
  vermilion: {name: Vermilion, station_id: null}   # user-confirmed 2026-09-30: old (historical) study plot, distinct from Simpson; no station given; location unknown to user and absent from files
site_aliases:
  bow_summit: ["bow summit", "bow summit plot", "bow plot", "bow summit study plot"]
  goats_eye: ["goat's eye", "goats eye", "ssv goat's eye", "goat's eye plot", "goats eye plot"]
  tak_falls: ["tak falls", "tak falks", "takkakaw falls", "takakkaw falls", "takk falls", "takakkaw", "takkakaw"]
  vermilion: ["vermilion", "vermillion", "vermilion pass", "vermillion pass"]
# Further names that printed site/location fields use for a plot (besides the names above). Used only to flag a
# transcribed pit whose printed name names another place than its folder's plot (ADR-049); never to assign a site.
printed_site_names:
  goats_eye: ["goats", "ge", "ssv", "sunshine", "shot plot"]   # "GE Shot Plot", "SSV Study Plot", "Sunshine SP"
  bow_summit: ["bow pass"]                                    # "Bow Pass, Alberta": the app's place name at the plot
  tak_falls: ["tak"]                                          # "Tak Plot", "Tak Study Plot"
# A header location farther than this from the site's consensus location is flagged
location_outlier_km: 1.0
