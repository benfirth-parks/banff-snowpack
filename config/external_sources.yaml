# External data sources approved by the user (2026-09-30: "hourly weather data history from NOAA";
# "see if you can get terrain and archived forecasts on the internet"). Raw files -> data/raw/<source>/.
noaa_isd:
  base: https://noaa-global-hourly-pds.s3.amazonaws.com   # AWS Open Data mirror of NCEI Global Hourly
  years: [1996, 2026]
  note: study-plot stations (Simpson Lower/Upper, Bow Summit, Sunshine Village) are NOT in ISD
  stations:   # nearest ISD stations, id = USAF+WBAN
    banff_cs:        {id: "71122099999", lat: 51.200, lon: -115.550, elev_m: 1397}
    banff_mars:      {id: "71122699999", lat: 51.200, lon: -115.550, elev_m: 1396}
    yoho_park:       {id: "71786099999", lat: 51.450, lon: -116.350, elev_m: 1602}
    nakiska_ridgetop: {id: "71245099999", lat: 50.933, lon: -115.183, elev_m: 2543}
    bow_valley:      {id: "71232099999", lat: 51.083, lon: -115.067, elev_m: 1298}
    golden:          {id: "71035499999", lat: 51.299, lon: -116.982, elev_m: 785}
copernicus_dem:
  base: https://copernicus-dem-30m.s3.amazonaws.com   # Copernicus GLO-30 DSM, COG tiles, 1 arc-second
  tiles_lat: [50, 51]      # tile SW corners covering the study area (N50-N52, W118-W115)
  tiles_lon: [-118, -117, -116]
esa_worldcover:
  # Land cover for terrain units (terrain-forecast spec: "terrain units from a DEM and land cover"); fetched under
  # the user's terrain approval above. ESA WorldCover 2021 v200, 10 m, CC BY 4.0. Class mapping: ingest/worldcover.py
  base: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map
  tiles: [N51W117]
fts360:
  # README §6 primary actuals. Station hex ids from the user's Rockies Weather Explorer
  # (github.com/benfirth-parks/weather-explorer, netlify/functions/_weather-archive.mjs).
  # Auth: environment credential for fts360api.com (Authorization: Bearer ...); never stored here.
  agency: 450
  start: "2015-10-01"
  stations:
    simpson_lower:  "6160c6b964699463087281fa"
    simpson_upper:  "6160c6ba6469946308728203"
    bow_summit:     "6160c6b964699463087281ec"
    bow_summit_precip_ab_env: "6160c6ba6469946308728202"
    sunshine_village_ab_env: "6160c6b964699463087281e8"
    lookout:        "6160c6b964699463087281e7"
    whymper:        "6160c6b964699463087281e3"
    stanley_lower:  "6160c6b964699463087281ea"
    vermilion:      "6160c6b964699463087281e0"
    lake_louise:    "6160c6b964699463087281eb"
    skoki:          "61e09ba56a379f48b21582f7"
    bosworth_lower: "6160c6b964699463087281d9"
    bosworth_upper: "6160c6b964699463087281dc"
    vulture:        "6160c6b964699463087281e9"
webcams:
  # Banff Sunshine Village public webcams via Windy Webcams (user approval 2026-10-02: "yes go ahead"; ADR-041).
  # One capture per daily update; images resized to <= 1280 px. Context and checks only, never engine input.
  attribution: "Banff Sunshine Village webcams, via Windy Webcams (windy.com)"
  max_age_h: 48          # an image older than this at capture time is the off-season placeholder or a dead feed
  cams:
    snow_stake:
      name: Snow stake (new-snow board, stake 0-50 cm)
      elevation_m: 2195
      near_plot: goats_eye
      current: https://images-webcams.windy.com/06/1225916206/current/full/1225916206.jpg
      daylight: https://images-webcams.windy.com/06/1225916206/daylight/full/1225916206.jpg
    trappers_standish:
      name: Trappers & Standish (sky and terrain view)
      elevation_m: 2195
      near_plot: goats_eye
      current: https://images-webcams.windy.com/64/1462284664/current/full/1462284664.jpg
      daylight: https://images-webcams.windy.com/64/1462284664/daylight/full/1462284664.jpg
