# Fixed traits of the study plots for the lab's scorecard agent (snowagent.lab.agents.scorecard, ADR-122).
#
# DATED BEFORE TRAINING. `sheet` is the owner's Plot Site Sheet, marked final 2026-11-19T00:57:45Z. `maps` was
# computed 2026-11-19 about 03:15 UTC from NRCan MRDEM-30 (30 m bare-earth elevation) at the plot coordinates of
# config/plot_forcing.yaml and config/new_sites.yaml (scripts/site_terrain/). No agent of this family had been
# trained or scored when either was fixed. These values are never changed because of a score: a correction needs
# a reason that has nothing to do with results (for example a surveyed coordinate) and a note in docs/decisions.md.
#
# Coding of the sheet answers (the same for every plot):
#   moist_ground: "Damp" 1, "Dry, drains well" 0          deadfall: "Some" 1, "None" 0
#   cold_pool: "Somewhat cold" 0.5, not a cold pool 0      wind_exposed: "Some wind, light drifting" 0.5
#   sky_open: "Nearly all" 1.0, "About three quarters" 0.75
#   tree_dist_m: "5 to 15 m" 10, "15 to 40 m" 27.5         tree_height_m: "10 to 20 m" 15, "5 to 10 m" 7.5
# `filled_from_maps` lists sheet answers the owner left blank, read from the maps instead and told to the owner
# the same evening: cold_pool 0 where the plot sits above the ground within 500 m, wind_exposed 1.0 on Simpson's
# open shoulder and 0.5 at Parker Ridge.
# Answers that are the same at every plot (rocks, traffic, tree bombs, water nearby, ground bumps, frozen ground,
# shrub height, winter and spring sun) carry no contrast and are not used. Shelter: upwind maximum slope
# (Winstral Sx, degrees; positive = sheltered from wind from that direction) for N, NE, E, SE, S, SW, W, NW.
