# Snowpack Agent Lab (ADR-055): research benchmark of snowpack-prediction agents at three study plots.
# Decision support and research only, not an avalanche forecast. The daily run and the public site do not read this.
#
# Site coordinates and elevations are NOT repeated here: each site names its plot in plot_forcing.yaml, and the
# loader (snowagent.lab.settings.load_lab_config) reads lat, lon and elevation_m from there. The season start
# (15 Sep, snow-free plots) is read from the same file.
plot_forcing_config: plot_forcing.yaml     # relative to this file
display_timezone: America/Edmonton          # the UI shows local time; everything is stored in UTC
sites:
  BOW:
    plot_id: bow_summit
    display_name: Bow Summit
    # Wind for the lab's measured-weather table (ADR-056). The plot recipes list no wind station (the site runs take
    # wind from ERA5), so the station is named here: Bow Summit station, at the plot.
    wind: [bow_summit]
    reference_scenario: {name: Study plot, slope_deg: 0.0, aspect_deg: null, terrain_class: study_plot}
  GOAT:
    plot_id: goats_eye
    display_name: Sunshine / Goat's Eye
    wind: [lookout]                          # Lookout, 2.6 km away on a ridge at 2640 m (already the plot's RH source)
    reference_scenario: {name: Study plot, slope_deg: 0.0, aspect_deg: null, terrain_class: study_plot}
  SIMP:
    plot_id: simpson
    display_name: Simpson
    wind: [simpson_upper]                    # Simpson Upper, ridge crest 205 m above the plot
    reference_scenario: {name: Study plot, slope_deg: 0.0, aspect_deg: null, terrain_class: study_plot}
# Composite score weights (build guide). Frozen into every run manifest; the evolution loop may never change them.
scoring:
  weights:
    snow_depth: 0.20
    layer_structure: 0.30
    critical_layers: 0.25
    uncertainty: 0.15
    robustness: 0.10
# Weather import (`snowagent lab import`): station values first ("FTS360, else ERA5 backfill", owner 2026-10-05).
# An hour/variable no station supplied takes the ERA5 nearest-cell value, flagged `filled`, source `era5` (named,
# never silent); values stay at the station or the ERA5 cell height. ERA5 values count as available 5 days after
# their hour (benchmark.availability.era5_latency_h).
weather:
  era5_backfill: true
  era5_dir: data/interim/era5      # relative to the source checkout (read only)
# Season splits (keys "YYYY-YYYY", season starting 15 Sep; ADR-059). `mode`:
#   all   - every season in all_seasons is training data, nothing sealed (owner's default, 2026-10-05: "evolve the
#           agents on all season, and pits")
#   loso  - leave one season out: loso_holdout (or `--holdout` at build time) is held out, the rest train. Required
#           before an evolved agent can reach site output (CLAUDE.md principle 3).
#   split - development / validation / sealed test below. Provisional, owner to confirm; a season may be in one
#           split only (checked when the config loads); sealed-test truth is never read back without an unseal.
splits:
  mode: all
  all_seasons: [2015-2016, 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2020-2021, 2021-2022, 2022-2023, 2023-2024,
                2024-2025, 2025-2026]
  loso_holdout: null
  provisional: true                # applies to mode split
  development_seasons: [2015-2016, 2016-2017, 2017-2018, 2018-2019, 2019-2020, 2020-2021, 2021-2022, 2022-2023]
  validation_seasons: [2023-2024, 2024-2025]
  sealed_test_seasons: [2025-2026, 2026-2027]
# Benchmark cases (ADR-059, docs/lab/benchmark_protocol.md). A record is visible to a case only when it was
# available at the case's as-of time. No source records a publication time, so availability = observation (or issue)
# time + the delay below; every manifest records the assumption.
benchmark:
  availability:
    profile_delay_h: 24            # pit observed -> available. PROVISIONAL pending the owner's answer
    profile_delay_provisional: true
    weather_latency_h: 1           # station hour observed -> available
    gfs_latency_h: 5               # GFS 00 UTC run complete ~04:30 UTC (as weather.sources.GFS_LATENCY_H)
    era5_latency_h: 120            # ERA5T ~5 days behind real time (ADR-033): backfilled values
  forecast_h72:
    # ADR-060 (milestone 3): as_of = availability time (issue + gfs_latency_h) of the archived run whose leads reach
    # the pit, so the forecast covers the whole horizon. The archive's 00 UTC runs reach 72 h, so with the earliest
    # such run (longest_lead) the lead to the pit is 48-72 h and the horizon (as_of to pit) 43-67 h. `latest` takes
    # the last run before the pit instead. fixed_horizon = milestone 2 (as_of = pit - 72 h, run may end early).
    as_of_rule: run_reaches_valid
    run_choice: longest_lead
    search_window_h: 240           # runs issued at most this long before the pit are considered
    horizon_h: 72                  # stand-in cases (no reaching run) and fixed_horizon: as_of = pit time - 72 h
    max_run_age_h: 24              # fixed_horizon only: the run must be issued within 24 h before as_of
    gfs_dir: archive/forecasts/gfs # relative to the source checkout (read only)
  standin:                         # measured weather given as a forecast issued at as_of ("measured_standin"):
                                   # next_pit cases, and forecast cases with no archived run
    min_coverage: 0.5              # share of hours as_of..valid with temperature and precipitation
    withheld: [snow_depth_m, swe_mm]   # snowpack measurements, not weather: never in the stand-in
# Agent genome (milestone 3, ADR-061). A genome is an agent family plus that family's genes, nothing else: no profile,
# layer, date, case or pit data (owner, 2026-10-05: "each agent needs a 'genome'" and "we need to ensure agents just
# dont memorize these snowpacks"). Every gene is listed here with its range, unit and default; a genome naming a gene
# its family does not list, missing one, or holding a value outside the range is rejected. Genes are grouped in
# blocks: crossover swaps whole blocks, and two families can exchange only the blocks they share. Units are SI
# except temperatures in deg C where the name says _c (K for differences, _k), densities kg m-3, precipitation mm.
# Changing a range changes the config hash (frozen into every run manifest).
genome:
  max_genes: 64                 # size guard: a genome holds a few dozen numbers
  max_bytes: 4096               # size guard on the genome's JSON (a stored profile would not fit)
  blocks:
    forcing:                    # how an agent reads the visible weather
      precipitation_factor: {min: 0.5, max: 2.0, default: 1.0, unit: "1", doc: "multiplies precipitation (gauge undercatch, forecast bias)"}
      temperature_offset_k: {min: -3.0, max: 3.0, default: 0.0, unit: K, doc: "added to air temperature"}
      rain_snow_threshold_c: {min: -1.0, max: 3.0, default: 1.0, unit: degC, doc: "air temperature of a 50/50 rain-snow mix"}
      rain_snow_range_k: {min: 0.5, max: 4.0, default: 2.0, unit: K, doc: "width of the linear rain-snow transition"}
    new_snow:
      new_snow_density_kg_m3: {min: 40.0, max: 200.0, default: 80.0, unit: kg m-3, doc: "new-snow density at -10 degC and calm"}
      new_snow_density_temp_coeff: {min: 0.0, max: 10.0, default: 4.0, unit: kg m-3 K-1, doc: "density increase per K above -10 degC"}
      new_snow_density_wind_coeff: {min: 0.0, max: 20.0, default: 4.0, unit: kg m-3 per m s-1, doc: "density increase per m/s of wind"}
      storm_gap_h: {min: 3.0, max: 72.0, default: 12.0, unit: h, doc: "a dry spell longer than this starts a new layer"}
    settlement:
      settlement_rate_per_day: {min: 0.0, max: 0.2, default: 0.06, unit: d-1, doc: "fractional compaction per day of light snow near 0 degC"}
      settlement_temp_coeff: {min: 0.0, max: 0.15, default: 0.06, unit: K-1, doc: "compaction slows by exp(coeff x T) below 0 degC"}
      max_density_kg_m3: {min: 300.0, max: 550.0, default: 450.0, unit: kg m-3, doc: "density at which settlement stops"}
      melt_factor_mm_per_k_day: {min: 0.5, max: 8.0, default: 3.0, unit: mm K-1 d-1, doc: "degree-day melt of the top layers"}
    crust:
      melt_temp_threshold_c: {min: -2.0, max: 2.0, default: 0.0, unit: degC, doc: "air temperature above which the surface melts"}
      melt_hours_for_crust: {min: 1.0, max: 24.0, default: 3.0, unit: h, doc: "melt hours that make a crust once refrozen"}
      refreeze_temp_c: {min: -6.0, max: 0.0, default: -1.0, unit: degC, doc: "air temperature at which wet snow refreezes"}
      rain_crust_min_mm: {min: 0.5, max: 10.0, default: 2.0, unit: mm, doc: "rain on snow that makes a rain crust"}
    facets:
      facet_gradient_k_per_m: {min: 5.0, max: 30.0, default: 10.0, unit: K m-1, doc: "temperature gradient above which layers facet"}
      facet_hours: {min: 12.0, max: 240.0, default: 72.0, unit: h, doc: "hours above the gradient that turn a layer to facets"}
      near_surface_depth_m: {min: 0.05, max: 0.6, default: 0.2, unit: m, doc: "depth reached by the diurnal near-surface gradient"}
      depth_hoar_hs_max_m: {min: 0.3, max: 2.0, default: 1.0, unit: m, doc: "basal facets grow to depth hoar only below this snow depth"}
      depth_hoar_hours: {min: 48.0, max: 960.0, default: 336.0, unit: h, doc: "strong-gradient hours that turn basal facets to depth hoar"}
    surface_hoar:
      sh_max_wind_ms: {min: 0.5, max: 5.0, default: 2.0, unit: m s-1, doc: "calm: wind at most this"}
      sh_max_air_temp_c: {min: -25.0, max: 0.0, default: -2.0, unit: degC, doc: "cold: air temperature at most this"}
      sh_min_rh: {min: 0.5, max: 1.0, default: 0.8, unit: "1", doc: "humid: relative humidity at least this"}
      sh_max_emissivity: {min: 0.6, max: 0.95, default: 0.8, unit: "1", doc: "clear: longwave / (sigma T^4) at most this"}
      sh_min_hours: {min: 2.0, max: 12.0, default: 4.0, unit: h, doc: "clear calm cold humid night hours that grow a layer"}
    rule_pit:
      pit_depth_nudge: {min: 0.0, max: 1.0, default: 0.5, unit: "1", doc: "weight of the latest season pit's depth on the rule snowpack (0 = weather only)"}
    pit:
      pit_trust: {min: 0.0, max: 1.0, default: 0.7, unit: "1", doc: "trust in the last available pit (depth vs measured depth; hybrid: insert its layers)"}
      depth_change_weight: {min: 0.0, max: 1.0, default: 0.8, unit: "1", doc: "share of the measured snow-depth change since the pit applied"}
      forecast_snow_weight: {min: 0.0, max: 1.0, default: 0.8, unit: "1", doc: "share of the forecast snowfall added after as-of"}
      pit_age_half_life_days: {min: 3.0, max: 60.0, default: 20.0, unit: d, doc: "layer confidence halves with this pit age"}
    analogue:
      window_days: {kind: int, min: 1, max: 21, default: 7, unit: d, doc: "weather window before as-of used as features"}
      k: {kind: int, min: 1, max: 15, default: 5, unit: "1", doc: "number of analogue cases"}
      weight_precip: {min: 0.0, max: 1.0, default: 1.0, unit: "1", doc: "feature weight: precipitation (window and horizon)"}
      weight_temp: {min: 0.0, max: 1.0, default: 0.5, unit: "1", doc: "feature weight: air temperature"}
      weight_wind: {min: 0.0, max: 1.0, default: 0.2, unit: "1", doc: "feature weight: wind"}
      weight_depth: {min: 0.0, max: 1.0, default: 1.0, unit: "1", doc: "feature weight: current snow depth"}
      kernel: {kind: choice, choices: [uniform, inverse_distance], default: inverse_distance, unit: "-", doc: "neighbour weighting"}
      same_site_only: {kind: choice, choices: ["yes", "no"], default: "yes", unit: "-", doc: "analogues from the same plot only"}
      depth_mode: {kind: choice, choices: [change, absolute], default: change, unit: "-", doc: "carry the analogues' depth change or their depth"}
    engine_output:
      hardness_merge_tol: {min: 0.25, max: 1.5, default: 0.5, unit: hand-hardness index, doc: "engine elements of one grain class within this hardness are one layer"}
    blend:
      snowpack_weight: {min: 0.0, max: 1.0, default: 0.6, unit: "1", doc: "hybrid: weight of the SNOWPACK depth and structure"}
      persistence_weight: {min: 0.0, max: 1.0, default: 0.3, unit: "1", doc: "hybrid: weight of the carried-forward pit"}
      rule_weight: {min: 0.0, max: 1.0, default: 0.1, unit: "1", doc: "hybrid: weight of the weather-rule layers"}
      boundary_match_m: {min: 0.02, max: 0.3, default: 0.08, unit: m, doc: "hybrid: a layer within this depth counts as already present"}
    uncertainty:
      depth_spread_frac: {min: 0.02, max: 0.5, default: 0.12, unit: "1", doc: "p10/p90 snow depth = p50 x (1 -/+ this) -/+ floor"}
      depth_spread_floor_m: {min: 0.0, max: 0.3, default: 0.05, unit: m, doc: "minimum half-width of the depth interval"}
      boundary_spread_m: {min: 0.0, max: 0.3, default: 0.05, unit: m, doc: "half-width of layer boundary intervals"}
      presence_confidence: {min: 0.3, max: 1.0, default: 0.7, unit: "1", doc: "probability a predicted layer is present (scaled per agent)"}
  families:                     # agent family -> its gene blocks (in this order)
    persistence: [pit, forcing, new_snow, settlement, uncertainty]
    weather_rule: [forcing, new_snow, settlement, crust, facets, surface_hoar, rule_pit, uncertainty]
    analogue: [analogue, uncertainty]
    snowpack: [engine_output, uncertainty]   # SNOWPACK settings as genes: milestone 5
    hybrid: [blend, pit, forcing, new_snow, uncertainty]
