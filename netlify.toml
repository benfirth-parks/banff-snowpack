# Static site: no build step. Data under data/ is generated by `snowagent.web.build` (ADR-035).
[build]
  publish = "."
  command = "echo static"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
